# Cambiar generation_model NO obliga a reconstruir el índice.
# Cambiar embedding_model SÍ obliga: no se mezclan espacios vectoriales.
[ollama]
base_url = "http://127.0.0.1:11434"
generation_model = "qwen2.5:1.5b"
embedding_model = "embeddinggemma:latest"
timeout_seconds = 240
# Perfil para CPU con 16 GB: evita recargar modelos entre preguntas.
# Con poca RAM, usa "0" o activa «Ahorrar RAM entre preguntas» en la app.
keep_alive = "5m"
# Demostración reproducible sin tarjeta gráfica dedicada.
force_cpu = true
# Punto de partida para i7-1365U; configurable, no benchmark del equipo destino.
num_threads = 4

[rag]
chunk_chars = 1000
chunk_overlap = 160
top_k = 4
min_similarity = 0.40
max_context_chars = 4200
context_tokens = 4096
max_answer_tokens = 384
